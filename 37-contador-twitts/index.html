<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#37 Contador de Twitts</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="content" class="exercise-page">
        <a href="../" class="back-link">← Volver</a>
        <h1>RESULTADO</h1>
        <div class="chat-space">
            <div class="tools">
                <div class="elemento-principal">
                    <p>chat</p>
                </div>
                <div class="elemento-secundario">
                    <div>
                        <p>−</p>
                    </div>
                    <div>
                        <p>❒</p>
                    </div>
                    <div>
                        <p>×</p>
                    </div>
                </div>
            </div>
            <div class="text-area">
                <div class="profile">
                    <img src="assets/Jellyfish.png" alt="">
                </div>
                <div class="icon">
                    <p>▶</p>
                </div>
                <div class="text">
                    <textarea name="twitt" id="myTextArea" rows="4" maxlength="145"></textarea>
                </div>
            </div>
            <div class="counter-area">
                <p><span id="counter">0</span>/145</p>
            </div>
            <input type="button" class="btn-abrir btn" value="ENVIAR">
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
