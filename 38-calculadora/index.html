<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#38 Calculadora</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="content" class="exercise-page">
        <a href="../" class="back-link">← Volver</a>
        <h1>RESULTADO</h1>
        <div class="result">
            <div class="calculator">
                <p>Calculadora</p>
                <div id="screen" class="panel">
                </div>
                <div class="buttons">
                    <input type="button" class="number btn" value="7">
                    <input type="button" class="number btn" value="8">
                    <input type="button" class="number btn" value="9">
                    <input type="button" class="operator btn" value="*">
    
                    <input type="button" class="number btn" value="4">
                    <input type="button" class="number btn" value="5">
                    <input type="button" class="number btn" value="6">
                    <input type="button"class="operator btn" value="/">
    
                    <input type="button" class="number btn" value="1">
                    <input type="button" class="number btn" value="2">
                    <input type="button" class="number btn" value="3">
                    <input type="button" class="operator btn" value="-">
    
                    <input type="button" class="number btn" value="0">
                    <input type="button" class="number btn" value=".">
                    <input type="button" id="equal" class="btn" value="=">
                    <input type="button" class="operator btn" value="+">
                </div>
                
            </div>
            <input type="button" id="btn-clear" class="btn-abrir" value="Limpiar">
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
